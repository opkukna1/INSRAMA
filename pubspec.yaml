name: insrama
description: "INS Rama - Dispatch & Audit Management Portal"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Local File Picker & Directory Access
  file_picker: ^8.1.2
  path_provider: ^2.1.4

  # Local Storage (Hive NoSQL DB for fast offline storage)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Excel Parsing & DOCX Template Filling
  excel: ^4.0.3
  docx_template: ^0.4.0

  # Gemini AI Direct Integration (No Backend Needed)
  google_generative_ai: ^0.4.2

  # Environment Variables & Preferences
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.2.3

  # Optional Firebase Sync
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
