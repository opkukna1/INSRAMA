name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Dummy .env File
        run: |
          touch .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Re-create Android Platform Files
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.insrama.app

      - name: Configure SDK & NDK Versions
        run: |
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          # GitHub Actions me pre-installed stable NDK version force karein (Download corruption se bachne ke liye)
          echo "flutter.ndkVersion=26.1.10909125" >> android/local.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch Plugins & Force NDK
        run: |
          export PUB_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          echo "Patching pub cache at $PUB_DIR"
          
          # Plugins ko compileSdk 36 par force karein
          find "$PUB_DIR" -type f -name "build.gradle" -exec sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g' {} + || true
          find "$PUB_DIR" -type f -name "build.gradle" -exec sed -i 's/compileSdk [0-9]*/compileSdk 36/g' {} + || true
          find "$PUB_DIR" -type f -name "build.gradle.kts" -exec sed -i 's/compileSdk = [0-9]*/compileSdk = 36/g' {} + || true
          
          # build.gradle.kts me NDK version forcefully inject karein
          sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "26.1.10909125"/g' android/app/build.gradle.kts || true

      - name: Accept Android Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Generate Hive Models
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Release APK
        run: flutter build apk --release

      - name: Locate and Check Generated APK
        run: |
          echo "Listing generated APK files:"
          find build/ -name "*.apk" || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
