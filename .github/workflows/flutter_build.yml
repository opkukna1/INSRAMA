name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Re-create Android Platform Files
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.insrama.app

      - name: Force compileSdk 36 globally for App and All Plugins
        run: |
          # 1. Update local.properties
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          
          # 2. Force subprojects/plugins to compile against SDK 36 in root build.gradle
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Hive Models
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons --target-platform android-arm,android-arm64,android-x64

      - name: Locate and Check Generated APK
        run: |
          echo "Listing generated APK files:"
          find build/ -name "*.apk" || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/**/*.apk
