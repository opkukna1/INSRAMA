name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Dummy .env File
        run: |
          touch .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Re-create Android Platform Files
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.insrama.app

      - name: Configure local.properties
        run: |
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          echo "flutter.ndkVersion=26.1.10909125" >> android/local.properties

      - name: Force compileSdk 36 via Plugin Hooks
        run: |
          cat << 'EOF' >> android/build.gradle.kts

          subprojects {
              fun applySdkOverride(p: Project) {
                  val androidExt = p.extensions.findByName("android") ?: return
                  try {
                      val method = androidExt.javaClass.getMethod("setCompileSdkVersion", Int::class.javaPrimitiveType)
                      method.invoke(androidExt, 36)
                  } catch (_: Exception) {
                      try {
                          val method = androidExt.javaClass.getMethod("compileSdkVersion", Int::class.javaPrimitiveType)
                          method.invoke(androidExt, 36)
                      } catch (_: Exception) {}
                  }
              }

              plugins.withId("com.android.library") { applySdkOverride(this@subprojects) }
              plugins.withId("com.android.application") { applySdkOverride(this@subprojects) }
          }
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Accept Android Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Generate Hive Models
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Release APK
        run: flutter build apk --release

      - name: Locate and Check Generated APK
        run: |
          echo "Listing generated APK files:"
          find build/ -name "*.apk" || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
